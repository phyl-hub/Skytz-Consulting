<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <!-- Subtle inner shadow for depth -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Top gold accent stripe – echoes engineering precision -->
  <rect x="72" y="62" width="368" height="7" rx="3.5" fill="#f59e0b" opacity="0.85"/>

  <!-- Bold "S" lettermark, vertically centered -->
  <text
    x="256"
    y="390"
    font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif"
    font-size="370"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-8"
  >S</text>

  <!-- Bottom gold accent stripe -->
  <rect x="72" y="443" width="368" height="7" rx="3.5" fill="#f59e0b" opacity="0.85"/>
</svg>
