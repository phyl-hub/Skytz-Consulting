name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Guards the fix set behind the website cleanup: single booking identity,
      # no invented call duration, mandate list generated from the vacancy data,
      # no analytics or remote fonts loaded before consent.
      - name: Trust invariants
        run: npm run check:trust
